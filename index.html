<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام إدارة النتائج ولجنة الرأفة</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
  <div class="container py-5">
    <h2 class="text-center mb-4 fw-bold text-primary">نظام إدارة النتائج ولجنة الرأفة</h2>

    <div class="row g-4">
      <div class="col-md-5">
        <div class="card shadow-sm border-0">
          <div class="card-header bg-primary text-white fw-bold">بيانات الطالب</div>
          <div class="card-body">
            <div id="errorBox" class="alert alert-danger d-none" role="alert"></div>

            <div class="mb-3">
              <label for="studentName" class="form-label">اسم الطالب</label>
              <input type="text" id="studentName" class="form-control" placeholder="اكتب اسم الطالب">
            </div>

            <div class="row g-2 mb-3">
              <div class="col-4">
                <label for="sub1" class="form-label">المادة 1</label>
                <input type="number" id="sub1" class="form-control" placeholder="0 - 100">
              </div>
              <div class="col-4">
                <label for="sub2" class="form-label">المادة 2</label>
                <input type="number" id="sub2" class="form-control" placeholder="0 - 100">
              </div>
              <div class="col-4">
                <label for="sub3" class="form-label">المادة 3</label>
                <input type="number" id="sub3" class="form-control" placeholder="0 - 100">
              </div>
            </div>

            <div class="mb-4">
              <label for="attendance" class="form-label">نسبة الحضور</label>
              <input type="number" id="attendance" class="form-control" placeholder="0 - 100">
            </div>

            <div class="d-grid gap-2">
              <button type="button" id="addBtn" class="btn btn-success fw-bold">إضافة طالب</button>
              <button type="button" id="mercyBtn" class="btn btn-warning fw-bold text-dark">تفعيل لجنة الرأفة</button>
            </div>
          </div>
        </div>
      </div>

      <div class="col-md-7">
        <div class="card shadow-sm border-0 mb-4">
          <div class="card-header bg-dark text-white fw-bold">الطلاب المضافون</div>
          <div class="card-body" id="studentsBox"></div>
        </div>

        <div class="card shadow-sm border-0">
          <div class="card-header bg-info text-dark fw-bold">التقرير النهائي للجنة الرأفة</div>
          <div class="card-body" id="reportBox"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
